<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Page introuvable — AuDHD Tools</title>
    <script>
      (() => {
        const localized = window.location.pathname.match(/^(.*)\/(fr|en)(?:\/|$)/);
        if (localized) return window.location.replace(`${localized[1]}/${localized[2]}/`);
        const saved = localStorage.getItem("audhd-tools:language");
        const language = saved === "en" || saved === "fr" ? saved : navigator.language.toLowerCase().startsWith("fr") ? "fr" : "en";
        const parts = window.location.pathname.split("/").filter(Boolean);
        const base = parts.length > 1 ? `/${parts[0]}` : "";
        window.location.replace(`${base}/${language}/`);
      })();
    </script>
  </head>
  <body>
    <p>Redirection… / Redirecting…</p>
  </body>
</html>
