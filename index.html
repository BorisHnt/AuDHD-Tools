<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f7f7f2" />
    <link rel="icon" href="./icon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./assets/styles.css" />
    <title>AuDHD Tools</title>
    <script>
      (() => {
        const saved = localStorage.getItem("audhd-tools:language");
        const browserLanguage = navigator.language.toLowerCase();
        const language = ["fr", "en", "ru"].includes(saved) ? saved : browserLanguage.startsWith("fr") ? "fr" : browserLanguage.startsWith("ru") ? "ru" : "en";
        window.location.replace(`./${language}/`);
      })();
    </script>
  </head>
  <body>
    <main class="empty-state">
      <h1>AuDHD Tools</h1>
      <p><a class="button primary" href="./fr/">Français</a> <a class="button secondary" href="./en/">English</a> <a class="button secondary" href="./ru/">Русский (Beta)</a></p>
    </main>
  </body>
</html>
